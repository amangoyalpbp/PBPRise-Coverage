<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PBP Rise Review Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --blue:#2F6BFF; --blue-600:#2158e6; --blue-700:#1b48bd;
  --navy:#0B1E4D; --navy-2:#0a2a63; --navy-ink:#08163a;
  --tint:#EEF3FF; --tint-2:#F5F8FF; --page:#F4F6FB;
  --ink:#141B34; --sub:#5A6785; --mut:#8A96B2;
  --line:#E6EBF5; --line-2:#eef1f8; --white:#fff;
  --green:#16A34A; --green-t:#E7F7ED;
  --amber:#E08A00; --amber-t:#FEF3D9;
  --red:#DC2626; --red-t:#FDE8E8;
  --grey:#94A3B8; --grey-t:#EEF1F6;
  --sh-sm:0 1px 2px rgba(11,30,77,.06),0 1px 3px rgba(11,30,77,.05);
  --sh:0 6px 24px rgba(11,30,77,.08);
  --sh-lg:0 18px 50px rgba(11,30,77,.16);
  --r:16px; --r-sm:11px;
  --disp:"Poppins",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--disp);margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#cdd6ea;border-radius:8px}

/* ---------- shell ---------- */
.shell{max-width:1320px;margin:0 auto;padding:0 22px 60px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:1320px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--navy)}
.logo .hash{color:var(--blue);font-weight:800}
.logo .com{color:var(--blue);font-size:12px;font-weight:700;vertical-align:super}
.logo .tag{font-family:var(--body);font-size:8.5px;font-weight:700;color:var(--mut);letter-spacing:.14em;display:block;margin-top:-3px}
.topbar h1{font-size:15px;font-weight:700;color:var(--ink)}
.topbar .div{width:1px;height:26px;background:var(--line)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--sub);background:var(--tint);padding:6px 12px;border-radius:999px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-t)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:16px 0 4px;flex-wrap:wrap}
.tab{padding:9px 17px;border-radius:999px;font-weight:600;font-size:13px;color:var(--sub);transition:.15s}
.tab:hover{background:var(--tint-2);color:var(--ink)}
.tab.on{background:var(--navy);color:#fff;box-shadow:var(--sh-sm)}

/* ---------- filter bar ---------- */
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--sh-sm);margin:6px 0 22px}
.fgroup{display:flex;align-items:center;gap:9px}
.flabel{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.seg{display:flex;background:var(--grey-t);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sub);transition:.12s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:var(--sh-sm)}
.chip{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--sub);background:var(--grey-t);transition:.12s}
.chip.on{background:var(--blue);color:#fff}
.chip:hover:not(.on){background:#e2e8f5}
.fdiv{width:1px;height:24px;background:var(--line)}

/* ---------- layout ---------- */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g-map{grid-template-columns:1.55fr 1fr}
.span2{grid-column:span 2}
.section-h{display:flex;align-items:center;gap:11px;margin:30px 0 15px}
.section-h .eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.section-h h2{font-size:19px;font-weight:700}
.section-h .rule{flex:1;height:1px;background:var(--line)}
.section-h .note{font-size:12px;color:var(--mut);font-weight:500}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-sm)}
.card.pad0{padding:0;overflow:auto;max-height:78vh}
.tbl thead th{position:sticky;top:0;z-index:6;background:#eef3ff;box-shadow:inset 0 -1px 0 var(--line)}
.kpi{position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi .k-label{font-size:12px;font-weight:600;color:var(--sub)}
.kpi .k-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--blue)}
.kpi .k-val{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .k-val small{font-size:16px;font-weight:700;color:var(--sub);margin-left:2px}
.kpi .k-sub{margin-top:10px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.delta.up{color:var(--green);background:var(--green-t)}
.delta.down{color:var(--red);background:var(--red-t)}
.delta.flat{color:var(--sub);background:var(--grey-t)}
.k-accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}

.stat-row{display:flex;flex-direction:column;gap:2px}
.stat-row .big{font-family:var(--disp);font-size:24px;font-weight:800}
.mini-label{font-size:12px;color:var(--sub);font-weight:600}

/* progress */
.pbar{height:9px;border-radius:999px;background:var(--grey-t);overflow:hidden;margin-top:9px}
.pbar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#5b8bff)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--tint-2)}
.tbl .prog-name{font-weight:700;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.blue{color:var(--blue);background:var(--tint)}
.pill.green{color:var(--green);background:var(--green-t)}
.pill.grey{color:var(--sub);background:var(--grey-t)}
.tag-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- map ---------- */
.map-card{background:linear-gradient(160deg,#0d2456,#081638 70%);border:1px solid #16326e;color:#fff;border-radius:var(--r);padding:0;overflow:hidden;position:relative}
.map-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 6px}
.map-head h3{font-size:16px;color:#fff}
.map-head p{margin:4px 0 0;font-size:12px;color:#9fb2df}
.map-wrap{position:relative;padding:2px 10px 14px}
.map-wrap svg{width:100%;height:auto;display:block}
.state{fill:#12336e;stroke:#0a1f4a;stroke-width:.5;transition:fill .2s}
.state.hl{fill:#1c4796}
.state.dim{fill:#0f2a5c}
.bub{fill:#5b8bff;stroke:#bcd0ff;stroke-width:1;opacity:.9;cursor:pointer;transition:.15s}
.bub:hover{fill:#8fb0ff}
.bub-glow{fill:#5b8bff;opacity:.16;pointer-events:none}
.map-legend{display:flex;gap:16px;padding:0 22px 18px;flex-wrap:wrap;font-size:11.5px;color:#9fb2df}
.map-legend b{color:#fff}
.map-tip{position:absolute;pointer-events:none;background:#04102e;border:1px solid #24478f;border-radius:9px;padding:8px 11px;font-size:12px;color:#fff;opacity:0;transition:.1s;transform:translate(-50%,-118%);white-space:nowrap;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.map-tip b{color:#8fb0ff}

/* ---------- charts ---------- */
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.chart-head h3{font-size:16px}
.chart-head .sub{font-size:12px;color:var(--mut);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);font-weight:600}
.legend i{width:20px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.legend i.dash{background:none!important;border-top:2px dashed}
svg .axis{stroke:var(--line)}
svg .gl{stroke:var(--line-2)}
svg text.tick{fill:var(--mut);font-size:10.5px;font-family:var(--body)}
svg .barlbl{fill:var(--sub);font-size:11px;font-weight:700}
.dot-m{fill:#fff;stroke-width:2}

/* stacked bucket bar */
.bstack{display:flex;height:38px;border-radius:10px;overflow:hidden;margin:6px 0 14px}
.bstack>div{display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;min-width:2px}
.bkey{display:flex;gap:16px;flex-wrap:wrap}
.bkey .it{display:flex;align-items:center;gap:8px;font-size:12px}
.bkey .sw{width:11px;height:11px;border-radius:3px}
.bkey .v{font-weight:700}
.bkey .l{color:var(--sub)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut-center{text-align:center}
.donut-center .p{font-family:var(--disp);font-size:26px;font-weight:800}
.donut-center .l{font-size:11px;color:var(--mut);font-weight:600}

/* maturity banner */
.mature{display:flex;align-items:flex-start;gap:10px;background:var(--amber-t);border:1px solid #f3d68a;border-radius:12px;padding:12px 15px;font-size:12.5px;color:#8a5b00;margin-bottom:16px}
.mature b{color:#7a5000}
.mat-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-t);padding:2px 8px;border-radius:999px}
.impact-empty{display:grid;place-items:center;text-align:center;padding:44px 20px;color:var(--sub)}
.impact-empty .ic{width:52px;height:52px;border-radius:14px;background:var(--amber-t);display:grid;place-items:center;margin-bottom:12px}

.card-h{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px}
.toggle{display:flex;background:var(--grey-t);border-radius:10px;padding:3px}
.toggle button{padding:7px 15px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sub)}
.toggle button.on{background:var(--navy);color:#fff}
.hint{font-size:12px;color:var(--sub);background:var(--tint-2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:11px 14px;margin-top:14px;line-height:1.5}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}
@media(max-width:960px){.g4{grid-template-columns:1fr 1fr}.g3,.g-map{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.span2{grid-column:auto}}

/* ---------- period calendar popover ---------- */
.period-wrap{position:relative}
.period-btn{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;box-shadow:var(--sh-sm)}
.period-btn .caret{opacity:.7;transition:.15s}
.period-btn.on .caret{transform:rotate(180deg)}
.period-btn:hover{background:var(--navy-2)}
.period-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:60;width:290px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);padding:15px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.15s}
.period-pop.open{opacity:1;visibility:visible;transform:translateY(0)}
.pop-label{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.pop-presets{display:flex;flex-direction:column;gap:6px}
.pop-presets button{text-align:left;padding:9px 12px;border-radius:9px;background:var(--tint-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);transition:.12s}
.pop-presets button:hover{background:var(--tint)}
.pop-presets button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pop-sub{font-size:11px;color:var(--mut);margin-top:9px;line-height:1.45}
.pop-divider{height:1px;background:var(--line);margin:13px 0}
.pop-custom{display:flex;gap:10px}
.pop-custom label{flex:1;display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--sub)}
.pop-custom input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:var(--body);font-size:12.5px;color:var(--ink)}
.pop-apply{width:100%;margin-top:11px;padding:9px;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:12.5px}
.pop-apply:hover{background:var(--navy-2)}

/* ---------- redesigned map ---------- */
.map-card{background:radial-gradient(120% 90% at 30% 10%,#123061 0%,#0b1e4d 45%,#081334 100%);border:1px solid #17347a;border-radius:var(--r);overflow:hidden;position:relative;box-shadow:var(--sh)}
.map-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 4px}
.map-head h3{font-size:16px;color:#fff}
.map-head p{margin:4px 0 0;font-size:12px;color:#9fb2df}
.map-badge{font-size:11px;font-weight:700;color:#bcd0ff;background:#12336e;border:1px solid #21468f;padding:5px 11px;border-radius:999px;white-space:nowrap}
.map-body{display:grid;grid-template-columns:1fr 210px;gap:6px;padding:6px 16px 18px;align-items:stretch}
.map-canvas{position:relative}
.map-canvas svg{width:100%;height:auto;display:block}
.mring{fill:none;stroke:#8fb0ff}
.mstate{fill:#123363;stroke:#0b1f4a;stroke-width:.6;transition:fill .2s}
.mstate.hl{fill:#1d4a99}
.mstate.dim{fill:#0f2953}
.mpulse{fill:none;stroke:#8fb0ff;stroke-width:1;opacity:.35}
.mbub{fill:#5b8bff;stroke:#cfe0ff;stroke-width:1.2;opacity:.95;cursor:pointer;transition:.15s}
.mbub:hover{fill:#9cbcff}
.map-tip{position:absolute;pointer-events:none;background:#04102e;border:1px solid #24478f;border-radius:9px;padding:8px 11px;font-size:12px;color:#fff;opacity:0;transition:.1s;transform:translate(-50%,-118%);white-space:nowrap;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.map-tip b{color:#8fb0ff}
.map-rail{display:flex;flex-direction:column;gap:9px;padding:8px 6px 0 8px;border-left:1px solid #1b3a7d}
.mrail-title{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7f97cd;margin-bottom:2px}
.mrail-row{display:flex;gap:8px;align-items:flex-start}
.mrail-rank{flex:0 0 15px;font-family:var(--disp);font-size:13px;font-weight:800;color:#3f63b0;text-align:center;line-height:1.3}
.mrail-main{flex:1;min-width:0}
.mrail-name{font-size:12px;font-weight:600;color:#e8eeff;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mrail-name>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrail-name b{font-family:var(--disp);color:#cfe0ff;font-weight:700;flex:0 0 auto}
.mrail-name em{font-style:normal;font-size:8.5px;font-weight:700;color:#8fb0ff;background:#12336e;padding:1px 5px;border-radius:4px;margin-left:5px}
.mrail-bar{height:5px;border-radius:999px;background:#12336e;overflow:hidden;margin-top:4px}
.mrail-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#5b8bff,#9cbcff)}
.map-legend{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:#8fa4d6;border-top:1px solid #1b3a7d}
.map-legend b{color:#cfe0ff}
.mrail-empty{font-size:12px;color:#8fa4d6;padding:20px 0}

/* ---------- MTD vs YTD comparison ---------- */
.cmp-head{display:flex;align-items:flex-start;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}
.cmp-head h3{font-size:15px}
.cmp-head .sub{font-size:11.5px;color:var(--mut);margin-top:3px;max-width:560px;line-height:1.5}
.cmp-legend{display:flex;gap:8px}
.cmp-k{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px}
.cmp-k.mtd{color:var(--blue);background:var(--tint)}
.cmp-k.ytd{color:var(--navy);background:#e5ebf7}
.cmp-tbl td.cmp-label{font-weight:600;color:var(--ink)}
.cmp-tbl td b{font-family:var(--disp);color:var(--blue)}
.cmp-bar{display:inline-block;width:70%;height:7px;border-radius:999px;background:var(--grey-t);overflow:hidden;vertical-align:middle;margin-right:9px}
.cmp-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#5b8bff)}
.cmp-share{font-size:11px;font-weight:700;color:var(--sub)}

.chase{font-weight:700;color:var(--amber)}

@media(max-width:960px){.map-body{grid-template-columns:1fr}.map-rail{border-left:none;border-top:1px solid #1b3a7d;padding-top:12px}}
svg text.axttl{fill:var(--mut);font-size:9.5px;font-weight:700;font-family:var(--body)}
.legend i.bar{width:11px;height:11px;border-radius:2px}

.trainer-sel{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--ink);min-width:180px}
.stickyhdr{position:sticky;top:0;z-index:50;background:var(--page);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(11,30,77,.4)}
.stickyhdr .inner{max-width:1320px;margin:0 auto;padding:12px 22px 12px}
.hdr-row{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hdr-row h1{font-size:17px;font-weight:700;color:var(--navy);font-family:var(--disp)}
.stickyhdr .tabs{padding:0 0 10px}
.stickyhdr .filters{margin:0}
.chip.disabled{opacity:.38;pointer-events:none;background:var(--grey-t);color:var(--mut)}
.shell{padding-top:18px}
</style>
</head>
<body>
<div class="stickyhdr"><div class="inner">
  <div class="hdr-row"><h1>PBP Rise Review Dashboard</h1><span class="spacer"></span><span class="live"><span class="dot"></span>FY27 YTD · May to Aug</span></div>
  <div class="tabs">
    <button class="tab on" data-view="overview">Overview</button>
    <button class="tab" data-view="trainers">Trainers</button>
    <button class="tab" data-view="geography">Geography</button>
    <button class="tab" data-view="reports">Reports</button>
  </div>
  <div class="filters">
    <div class="fgroup"><span class="flabel">Trainer</span><select id="trainerSel" class="trainer-sel"></select></div>
    <div class="fdiv"></div>
    <div class="fgroup"><span class="flabel">BU</span>
      <button class="chip on" data-bu="All">All</button><button class="chip" data-bu="Motor">Motor</button><button class="chip" data-bu="Health">Health</button><button class="chip" data-bu="Life">Life</button></div>
    <div class="fdiv"></div>
    <div class="fgroup"><span class="flabel">Zone</span>
      <button class="chip on" data-zone="All">All</button><button class="chip" data-zone="North">North</button><button class="chip" data-zone="West">West</button><button class="chip" data-zone="South">South</button><button class="chip" data-zone="East">East</button><button class="chip" data-zone="Central">Central</button><button class="chip" data-zone="NorthEast">NorthEast</button></div>
    <div class="fdiv"></div>
    <div class="fgroup" id="monthFilter"><span class="flabel">Month</span>
      <button class="chip on" data-month="All">All</button><button class="chip" data-month="May">May</button><button class="chip" data-month="June">Jun</button><button class="chip" data-month="July">Jul</button><button class="chip" data-month="August">Aug</button></div>
  </div>

function fAtt(){return B.att.filter(a=>a.s!=="invalid"&&(state.trainer==="All"||a.t===state.trainer)&&(state.bu==="All"||a.b===state.bu)&&(state.zone==="All"||a.z===state.zone)&&(state.month==="All"||a.m===state.month));}
function fAttAll(){return B.att.filter(a=>(state.trainer==="All"||a.t===state.trainer)&&(state.bu==="All"||a.b===state.bu)&&(state.zone==="All"||a.z===state.zone)&&(state.month==="All"||a.m===state.month));}

function coverage(sess){
 const cities=new Set(sess.map(s=>s.c));
 return {sessions:sess.length,actual:sess.reduce((a,s)=>a+s.a,0),gt15:sess.filter(s=>s.a>=15).length,
   mappedEC:cities.size,geo:cities.size};
}
function impact(att){
 const base=att.length;
 const nw=att.filter(a=>a.pre===0&&a.post>0).length;
 const ret=att.filter(a=>a.pre>0&&a.post>0).length;
 const lap=att.filter(a=>a.pre>0&&a.post===0).length;
 const dor=att.filter(a=>a.pre===0&&a.post===0).length;
 const m1d=att.filter(a=>a.pre===0).length, m1a=att.filter(a=>a.pre>0).length;
 const active=nw+ret;
 const db=att.filter(a=>a.nop>0);
 const med=arr=>{if(!arr.length)return 0;const s=[...arr].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};
 return {base,nw,ret,lap,dor,m1d,m1a,active,
   overall:base?active/base:0,newpct:m1d?nw/m1d:0,retpct:m1a?ret/m1a:0,
   avgAPE:base?att.reduce((a,x)=>a+x.post,0)/base:0,
   medAPE:med(db.map(a=>a.post)),medNOP:med(db.map(a=>a.nop))};
}
function matchRate(){const all=fAttAll();const m=all.filter(a=>a.s==="matched").length;return {rate:all.length?m/all.length:0,total:all.length,matched:m,dormant:all.filter(a=>a.s==="dormant").length,invalid:all.filter(a=>a.s==="invalid").length};}
function natFor(){
 const bu=(state.bu!=="All"&&B.nat[state.bu])?state.bu:"All";
 const t=B.nat[bu];
 if(state.month!=="All"&&t[state.month]!=null)return t[state.month]/100;
 return (t.May+t.June+t.July)/3/100;
}

/* charts */
function comboChart(months,bars,line,natline){
 const w=720,h=250,pl=42,pr=48,pt=18,pb=28,iw=w-pl-pr,ih=h-pt-pb,n=months.length;
 const x=i=>pl+iw*(i+0.5)/n,yP=v=>pt+ih-v*ih,bmax=Math.max(1,...bars)*1.25,yB=v=>pt+ih-v/bmax*ih;let g="";
 [0,.25,.5,.75,1].forEach(t=>{const yy=yP(t);g+=`<line class="gl" x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}"/><text class="tick" x="${pl-8}" y="${yy+3}" text-anchor="end">${t*100}%</text>`;});
 [0,.5,1].forEach(t=>{const yy=pt+ih-t*ih;g+=`<text class="tick" x="${w-pr+8}" y="${yy+3}" text-anchor="start">${nf(bmax*t)}</text>`;});
 const bw=iw/n*0.4;
 months.forEach((m,i)=>{g+=`<rect x="${x(i)-bw/2}" y="${yB(bars[i])}" width="${bw}" height="${pt+ih-yB(bars[i])}" rx="3" fill="#c9d8ff"/>`;g+=`<text class="tick" x="${x(i)}" y="${h-9}" text-anchor="middle">${m}</text>`;});
 const path=(vals,col,dash)=>{let p="";vals.forEach((v,i)=>{if(v!=null)p+=(p?"L":"M")+x(i)+" "+yP(v)+" ";});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':''} stroke-linecap="round" stroke-linejoin="round"/>`;};
 g+=path(natline,"#94A3B8",true);
 g+=path(line,"#0B1E4D",false);
 line.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${x(i)}" cy="${yP(v)}" r="3.5" fill="#0B1E4D"/>`;});
 // value labels: participants above bars, activation % at line points, national % on dashed line
 months.forEach((m,i)=>{g+=`<text x="${x(i)}" y="${yB(bars[i])-5}" text-anchor="middle" font-size="9.5" fill="#8a96b2" font-family="Inter">${nf(bars[i])}</text>`;});
 line.forEach((v,i)=>{if(v!=null)g+=`<text x="${x(i)}" y="${yP(v)-9}" text-anchor="middle" font-size="11" font-weight="700" fill="#0B1E4D" font-family="Inter">${(v*100).toFixed(0)}%</text>`;});
 natline.forEach((v,i)=>{if(v!=null)g+=`<text x="${x(i)}" y="${yP(v)+14}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#94A3B8" font-family="Inter">${(v*100).toFixed(0)}%</text>`;});
 g+=`<text class="axttl" x="${pl-32}" y="${pt-7}">Activation %</text><text class="axttl" x="${w-pr-6}" y="${pt-7}">Participants</text>`;
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}

function lerpColor(t){const a=[210,226,246],b=[11,46,107];const c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));return `rgb(${c[0]},${c[1]},${c[2]})`;}
function renderMap(el,sess,title,compact){
 const [W,H]=B.vb; const vbW=W+58;
 const by={};sess.forEach(s=>by[s.c]=(by[s.c]||0)+s.a);
 const data=Object.keys(by).map(c=>({c,v:by[c],...B.cities[c]})).filter(o=>o.x!=null).sort((a,b)=>b.v-a.v);
 el.className="card";
 if(!data.length){el.innerHTML=`<div class="chart-head"><h3>${title||'EC Reach'}</h3></div><div class="impact-empty">No sessions in this selection.</div>`;return;}
 const maxV=Math.max(...data.map(o=>o.v)),minV=Math.min(...data.map(o=>o.v)),span=(maxV-minV)||1;
 const rad=v=>13+Math.sqrt((v-minV)/span)*15;
 let st="";B.states.forEach(s=>st+=`<path d="${s.d}" fill="#ececec" stroke="#d4d9e2" stroke-width="0.6"/>`);
 let bub="";
 data.forEach(o=>{const r=rad(o.v),t=(o.v-minV)/span,tc=t>0.55?'#ffffff':'#12325a';
   bub+=`<circle cx="${o.x}" cy="${o.y}" r="${r}" fill="${lerpColor(t)}" fill-opacity="0.92" stroke="#5b8bff" stroke-width="1"/>`;
   bub+=`<text x="${o.x}" y="${o.y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${tc}" font-family="Inter">${o.v}</text>`;
   bub+=`<text x="${o.x+r+3}" y="${o.y+3.5}" font-size="10" fill="#5a6785" font-family="Inter">${CITYNAME(o.c)}</text>`;});
 const lg=`<defs><linearGradient id="lgG" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="${lerpColor(0)}"/><stop offset="100%" stop-color="${lerpColor(1)}"/></linearGradient></defs>
   <text x="${W+8}" y="30" font-size="10" fill="#5a6785" font-weight="700" font-family="Inter">Count</text>
   <rect x="${W+8}" y="38" width="12" height="120" fill="url(#lgG)" stroke="#d4d9e2"/>
   <text x="${W+24}" y="45" font-size="9" fill="#8a96b2" font-family="Inter">${maxV}</text>
   <text x="${W+24}" y="160" font-size="9" fill="#8a96b2" font-family="Inter">${minV}</text>`;
 el.innerHTML=`<div class="chart-head"><div><h3>${title||'EC Reach'}</h3><div class="sub">Participants trained by Experience Centre${state.zone!=="All"?' · '+state.zone+' zone':''}</div></div><span class="pill blue">${data.length} ECs</span></div>
   <svg viewBox="0 0 ${vbW} ${H}" style="${compact?'display:block;margin:0 auto;max-height:70vh;width:auto;max-width:100%':'width:100%;height:auto'}">${lg}${st}${bub}</svg>`;
}

const IC={s:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>',u:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',a:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',t:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>'};
function kpi(l,v,ic,sub,ac){return `<div class="card kpi"><div class="k-accent" style="background:${ac||'var(--blue)'}"></div><div class="k-top"><span class="k-label">${l}</span><span class="k-ic" style="color:${ac||'var(--blue)'};background:${(ac||'#2F6BFF')}1a">${ic}</span></div><div class="k-val">${v}</div><div class="k-sub">${sub||''}</div></div>`;}
function delta(v){const p=v*100,c=p>0.3?"up":p<-0.3?"down":"flat",a=p>0.3?"▲":p<-0.3?"▼":"—";return `<span class="delta ${c}">${a} ${Math.abs(p).toFixed(1)} pts</span>`;}
function sectionH(e,t,n){return `<div class="section-h"><span class="eyebrow">${e}</span><h2>${t}</h2><span class="rule"></span>${n?`<span class="note">${n}</span>`:''}</div>`;}

   const att=B.att.filter(a=>a.s!=="invalid"&&a.t===t&&(state.bu==="All"||a.b===state.bu)&&(state.zone==="All"||a.z===state.zone)&&(state.month==="All"||a.m===state.month));

   const c=coverage(sess),i=impact(att);

 });
 rows.sort((a,b)=>(a[state.sortKey]<b[state.sortKey]?1:-1)*state.sortDir);

 rows.sort((a,b)=>(b.covered-a.covered)||(b.tP-a.tP)||a.ec.localeCompare(b.ec)||a.bu.localeCompare(b.bu));
 const inEC=new Set(rows.map(r=>r.ec)).size, covEC=new Set(rows.filter(r=>r.covered).map(r=>r.ec)).size;
 const pend=rows.filter(r=>!r.covered);
 const uniqAll=new Set(B.att.filter(a=>a.ip&&(state.bu==="All"||a.b===state.bu)&&(state.zone==="All"||a.z===state.zone)&&(state.trainer==="All"||a.t===state.trainer)).map(a=>a.ip)).size;
 const scopeTxt=(state.trainer==="All"?"All trainers":state.trainer)+(state.bu==="All"?" · all BUs":" · "+state.bu);
 el.innerHTML=sectionH("Reports","EC Coverage Till Date",scopeTxt);
 el.innerHTML+=`<div class="grid g4" style="margin-bottom:4px">
   ${kpi("ECs Covered",covEC+'<small> / '+inEC+'</small>',IC.t,"Distinct ECs with a session","#16A34A")}
   ${kpi("Pending EC · BU",String(pend.length),IC.s,pend.length?"No session yet":"All covered","#E08A00")}
   ${kpi("Partners Covered",nf(rows.reduce((a,r)=>a+r.tP,0)),IC.u,"Total attendance","#2F6BFF")}
   ${kpi("Unique Partners",nf(uniqAll),IC.u,"Distinct codes · May to Jul","#0B1E4D")}
 </div>`;
 if(pend.length) el.innerHTML+=`<div class="hint" style="border-left-color:#E08A00;background:var(--amber-t)"><b>Pending (${pend.length}):</b> ${pend.map(p=>p.ec+" ("+p.bu+")").join(", ")}.</div>`;
 const cell=o=>o.s?`${nf(o.p)}<span style="color:var(--mut);font-size:10px"> (${o.s})</span>`:'<span style="color:var(--line)">·</span>';
 let h=`<div class="card pad0" style="margin-top:16px"><table class="tbl"><thead><tr><th>EC</th><th>Zone</th><th>BU</th><th>Mapped Trainer</th><th class="num">May</th><th class="num">Jun</th><th class="num">Jul</th><th class="num">Aug</th><th class="num">Sessions</th><th class="num">Partners</th><th class="num">Unique Partners</th><th class="num">Status</th></tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr${r.covered?'':' style="background:#fff8ec"'}><td class="prog-name">${r.ec}${r.extra?' <span class="pill grey" style="font-size:9px">extra</span>':''}</td><td><span class="pill grey">${r.z}</span></td><td><span class="pill blue">${r.bu}</span></td><td style="font-size:12px">${r.trainer}</td><td class="num mono">${cell(r.per.May)}</td><td class="num mono">${cell(r.per.June)}</td><td class="num mono">${cell(r.per.July)}</td><td class="num mono">${cell(r.per.August)}</td><td class="num mono">${r.tS}</td><td class="num mono"><b>${nf(r.tP)}</b></td><td class="num mono">${nf(r.uniq)}</td><td class="num">${r.covered?'<span class="pill green">Covered</span>':'<span class="pill" style="background:var(--amber-t);color:var(--amber)">Pending</span>'}</td></tr>`;});
 h+="</tbody></table></div>";
 const c=document.createElement("div");c.innerHTML=h;el.appendChild(c);
 return el;
}
function render(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.view===state.view));
 const mf=document.getElementById("monthFilter"); if(mf)mf.style.display=state.view==="reports"?"none":"";
 const root=document.getElementById("root");root.innerHTML="";
 root.appendChild(state.view==="overview"?viewOverview():state.view==="trainers"?viewTrainers():state.view==="reports"?viewReports():viewGeography());
 root.querySelectorAll(".tbl th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=-1;}render();});
}
const TBU={};B.sess.forEach(s=>{(TBU[s.t]=TBU[s.t]||new Set()).add(s.b);});
const ECZONE={};B.ecMaster.forEach(m=>ECZONE[m.ec]=m.z);
const TERR={};B.ecMaster.forEach(m=>{if(m.gi&&m.gi!=="(not in master)")(TERR[m.gi]=TERR[m.gi]||new Set()).add(m.ec);});
B.ecSess.forEach(s=>{(TERR[s.t]=TERR[s.t]||new Set()).add(s.ec);});
function mappedECcount(t){let n=0;(TERR[t]||new Set()).forEach(ec=>{if(state.zone==="All"||ECZONE[ec]===state.zone)n++;});return n;}
function allowedBUs(){return state.trainer==="All"?["Motor","Health","Life"]:[...(TBU[state.trainer]||[])];}
function updateBUchips(){
 const allow=allowedBUs();
 if(state.trainer!=="All"){
   if(allow.length===1)state.bu=allow[0];
   else if(state.bu!=="All"&&!allow.includes(state.bu))state.bu="All";
 }
 document.querySelectorAll("[data-bu]").forEach(c=>{const bu=c.dataset.bu;
   const ok=bu==="All"?(state.trainer==="All"||allow.length>1):allow.includes(bu);
   c.classList.toggle("disabled",!ok); c.classList.toggle("on",c.dataset.bu===state.bu);});
}
function initFilters(){
 document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.view=t.dataset.view;render();});
 const td=document.getElementById("trainerSel");
 td.innerHTML='<option>All</option>'+B.trainers.map(t=>`<option>${t}</option>`).join("");
 td.onchange=()=>{state.trainer=td.value;updateBUchips();render();};
 document.querySelectorAll("[data-bu]").forEach(c=>c.onclick=()=>{if(c.classList.contains("disabled"))return;state.bu=c.dataset.bu;document.querySelectorAll("[data-bu]").forEach(x=>x.classList.toggle("on",x===c));render();});
 document.querySelectorAll("[data-zone]").forEach(c=>c.onclick=()=>{state.zone=c.dataset.zone;document.querySelectorAll("[data-zone]").forEach(x=>x.classList.toggle("on",x===c));render();});
 document.querySelectorAll("[data-month]").forEach(c=>c.onclick=()=>{state.month=c.dataset.month;document.querySelectorAll("[data-month]").forEach(x=>x.classList.toggle("on",x===c));render();});
 updateBUchips();
}
initFilters();render();
</script>
</body>
</html>
